// Port of snakebar.py - space-filling curve progress bar

class Random {
    constructor(seed = null) {
        this.seed = seed !== null ? seed : Math.floor(Math.random() * 1000000);
        this.state = this.seed;
    }

    next() {
        // Simple LCG random number generator
        this.state = (this.state * 1664525 + 1013904223) % 4294967296;
        return this.state / 4294967296;
    }

    randrange(n) {
        return Math.floor(this.next() * n);
    }

    shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(this.next() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
}

function gridSpanningTree(ncols, nrows, seed = null) {
    const rng = new Random(seed);
    const N = ncols * nrows;
    const visited = new Array(N).fill(false);
    const edges = [];

    const row = (i) => Math.floor(i / ncols);
    const col = (i) => i % ncols;

    function neighbors(k) {
        const i = col(k), j = row(k);
        const ns = [];
        if (i > 0) ns.push(k - 1);           // left
        if (j > 0) ns.push(k - ncols);       // up
        if (i + 1 < ncols) ns.push(k + 1);   // right
        if (j + 1 < nrows) ns.push(k + ncols); // down
        return rng.shuffle(ns);
    }

    function visit(k) {
        visited[k] = true;
        for (const n of neighbors(k)) {
            if (!visited[n]) {
                edges.push([k, n]);
                visit(n);
            }
        }
    }

    visit(rng.randrange(N));

    const connect = Array(N).fill(null).map(() => ({left: false, right: false, up: false, down: false}));
    for (const [a, b] of edges) {
        const [i, j] = a <= b ? [a, b] : [b, a];
        if (row(i) === row(j)) {
            connect[i].right = true;
            connect[j].left = true;
        } else {
            connect[i].down = true;
            connect[j].up = true;
        }
    }

    return {nrows, ncols, edges, connect};
}

function hamiltonianFromSpanningTree(st) {
    const nrows2 = 2 * st.nrows;
    const ncols2 = 2 * st.ncols;
    const N2 = nrows2 * ncols2;
    const edges2 = [];

    const row = (i) => Math.floor(i / st.ncols);
    const col = (i) => i % st.ncols;
    const index2 = (i, dcol, drow) => (row(i) * 2 + drow) * ncols2 + (col(i) * 2 + dcol);

    for (let i = 0; i < st.connect.length; i++) {
        const cell = st.connect[i];

        if (cell.right) {
            edges2.push([index2(i, 1, 0), index2(i, 2, 0)]);
            edges2.push([index2(i, 1, 1), index2(i, 2, 1)]);
        } else {
            edges2.push([index2(i, 1, 0), index2(i, 1, 1)]);
        }

        if (!cell.left) {
            edges2.push([index2(i, 0, 0), index2(i, 0, 1)]);
        }

        if (cell.down) {
            edges2.push([index2(i, 0, 1), index2(i, 0, 2)]);
            edges2.push([index2(i, 1, 1), index2(i, 1, 2)]);
        } else {
            edges2.push([index2(i, 0, 1), index2(i, 1, 1)]);
        }

        if (!cell.up) {
            edges2.push([index2(i, 0, 0), index2(i, 1, 0)]);
        }
    }

    const links = Array(N2).fill(null).map(() => []);
    for (const [a, b] of edges2) {
        links[a].push(b);
        links[b].push(a);
    }

    const visited = new Array(N2).fill(false);
    let j = 0;
    const path = [];
    for (let _ = 0; _ < edges2.length; _++) {
        path.push(j);
        visited[j] = true;
        const [a, b] = links[j];
        j = visited[a] ? b : a;
    }

    return {nrows: nrows2, ncols: ncols2, path};
}

function computeDrawSequence(ham) {
    const order = [];
    const ncols = ham.ncols;
    const rc = (idx) => [Math.floor(idx / ncols), idx % ncols];

    order.push({kind: 'center', val: rc(ham.path[0])});

    for (let k = 0; k < ham.path.length - 1; k++) {
        const a = ham.path[k], b = ham.path[k + 1];
        const [r0, c0] = rc(a);
        const [r1, c1] = rc(b);

        let y, x;
        if (r0 !== r1) {
            y = Math.floor((2 * r0 + 2 * r1) / 2);
            x = 2 * c0;
        } else {
            y = 2 * r0;
            x = Math.floor((2 * c0 + 2 * c1) / 2);
        }
        order.push({kind: 'edge', val: [y, x]});
        order.push({kind: 'center', val: [r1, c1]});
    }

    const drawSeq = [];
    for (const {kind, val} of order) {
        if (kind === 'center') {
            const [r, c] = val;
            drawSeq.push([2 * r, 2 * c]);
        } else {
            drawSeq.push(val);
        }
    }
    return drawSeq;
}

class SnakeBar {
    constructor(total, options = {}) {
        this.total = Math.max(1, total);
        this.ch = options.ch || '█';
        this.bg = options.bg || ' ';
        this.seed = options.seed || null;
        this.desc = options.desc || '';
        this.colors = options.colors || ['#33ff33'];

        // Desired canvas size in characters
        const W = options.width || 60;
        const H = options.height || 20;

        // Choose spanning-tree size to fit interleaved canvas
        // Final canvas will be (4*st_nrows - 1) x (4*st_ncols - 1)
        // Because: ham is 2x spanning tree, then interleaved is 2x-1 of ham
        const stNrows = Math.max(1, Math.floor((H + 1) / 4));
        const stNcols = Math.max(1, Math.floor((W + 1) / 4));

        const st = gridSpanningTree(stNcols, stNrows, this.seed);
        this.ham = hamiltonianFromSpanningTree(st);

        const nrows = this.ham.nrows;
        const ncols = this.ham.ncols;
        this.nrows = nrows;
        this.ncols = ncols;

        // Build interleaved canvas: 2*nrows - 1 by 2*ncols - 1
        this.canvasHeight = 2 * nrows - 1;
        this.canvasWidth = 2 * ncols - 1;
        this.canvas = Array(this.canvasHeight).fill(null).map(() => Array(this.canvasWidth).fill(this.bg));

        this.drawSeq = computeDrawSequence(this.ham);
        this.drawnUpto = -1;
        this.progress = 0;
    }

    update(n = 1) {
        this.progress = Math.min(this.total, this.progress + n);
        const totalPts = this.drawSeq.length;

        let targetUpto;
        if (this.progress >= this.total) {
            targetUpto = totalPts - 1;
        } else {
            const frac = this.progress / this.total;
            targetUpto = Math.floor(frac * (totalPts - 1));
        }

        for (let k = this.drawnUpto + 1; k <= targetUpto; k++) {
            const [y, x] = this.drawSeq[k];
            if (y >= 0 && y < this.canvasHeight && x >= 0 && x < this.canvasWidth) {
                this.canvas[y][x] = this.ch;
            }
        }

        this.drawnUpto = targetUpto;
    }

    render() {
        return this.canvas.map(row => row.join('')).join('\n');
    }

    getPercentage() {
        return Math.floor((this.progress / this.total) * 100);
    }
}

// ========== END SNAKEBAR IMPLEMENTATION ==========

function makeClickable(text, command, index) {
    const id = (index !== undefined) ? `id="choice-${index}"` : '';
    return `<span ${id} class="clickable-cmd" onclick="executeCommand('${command}')">${text}</span>`;
}

function updateChoiceHighlight() {
    // Only highlight if adventure is active
    if(!bhAdventureActive) return;

    // Remove all previous highlights
    document.querySelectorAll('.choice-selected').forEach(el => {
        el.classList.remove('choice-selected');
    });
    // Highlight current choice
    const currentChoice = document.getElementById(`choice-${bhChoiceIndex}`);
    if(currentChoice) {
        currentChoice.classList.add('choice-selected');
    }
}

function executeCommand(cmd) {
    const lines = document.querySelectorAll('.command-line span[contenteditable="true"]');
    if(lines.length > 0) {
        const input = lines[lines.length - 1];
        input.textContent = cmd;
        input.dispatchEvent(new KeyboardEvent('keydown', {key: 'Enter', bubbles: true}));
    }
}

function animateSnakeBar() {
    // Clear the terminal for full screen experience
    terminal.innerHTML = '';

    // Measure character size to match terminal font
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'absolute';
    tempDiv.style.visibility = 'hidden';
    tempDiv.style.fontFamily = "'Courier New', Courier, monospace";
    tempDiv.style.fontSize = "max(16px, min(3vw, 20px))";
    tempDiv.style.whiteSpace = 'pre';
    tempDiv.textContent = '█';
    document.body.appendChild(tempDiv);

    const cellSize = tempDiv.offsetWidth; // Use character width as cell size
    document.body.removeChild(tempDiv);

    // Calculate canvas size
    const viewportWidth = Math.min(window.innerWidth, document.documentElement.clientWidth);
    const viewportHeight = Math.min(window.innerHeight, document.documentElement.clientHeight);

    const cols = Math.floor((viewportWidth - 40) / cellSize);
    const rows = Math.floor((viewportHeight - 100) / cellSize);

    // Create container
    const container = document.createElement('div');
    container.className = 'output';
    container.style.textAlign = 'left';

    // Progress text
    const progressText = document.createElement('div');
    progressText.style.color = '#33ff33';
    progressText.style.fontFamily = "'Courier New', Courier, monospace";
    progressText.style.marginBottom = '10px';
    progressText.textContent = 'SnakeBar Progress: 0% [v6 - canvas]';
    container.appendChild(progressText);

    // Create canvas
    const canvas = document.createElement('canvas');
    canvas.width = cols * cellSize;
    canvas.height = rows * cellSize;
    canvas.style.display = 'block';
    canvas.style.imageRendering = 'pixelated';
    container.appendChild(canvas);
    terminal.appendChild(container);

    const ctx = canvas.getContext('2d');

    const bar = new SnakeBar(100, {
        width: cols,
        height: rows,
        ch: '█',
        bg: ' ',
        seed: Math.floor(Math.random() * 10000)
    });

    let progress = 0;
    const interval = setInterval(() => {
        progress += 1;
        bar.update(1);

        // Clear canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw snake
        ctx.fillStyle = '#33ff33';
        for (let y = 0; y < bar.canvas.length; y++) {
            for (let x = 0; x < bar.canvas[y].length; x++) {
                if (bar.canvas[y][x] === '█') {
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        progressText.textContent = `SnakeBar Progress: ${bar.getPercentage()}% [v6 - canvas]`;

        if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => {
                const msg = document.createElement('div');
                msg.className = 'output';
                msg.innerHTML = "\nLike this? Install snakebar:\n\nPython:\n  pip install snakebar\n\nJulia:\n  pkg> add SnakeBar\n\nRepos:\n  - <a href='https://github.com/majoburo/snakebar' target='_blank'>Python version</a>\n  - <a href='https://github.com/majoburo/snakebar.jl' target='_blank'>Julia version</a>";
                terminal.appendChild(msg);
                createPrompt();
            }, 500);
        }
    }, 30);
}

function runBuiltinCommand(cmd) {
    const cmdLower = cmd.toLowerCase();

    // Black hole adventure game
    if(bhAdventureActive) {
        if(cmdLower === 'quit' || cmdLower === 'exit') {
            bhAdventureActive = false;
            bhChoiceIndex = 0;
            bhCurrentNode = 'start';
            terminal.innerHTML = '';
            const output = document.createElement('div');
            output.className = 'output';
            output.innerHTML = "Exiting black hole adventure. Back to normal terminal.";
            terminal.appendChild(output);
            createPrompt();
            return null;
        } else if(cmdLower === 'restart') {
            bhCurrentNode = 'start';
            bhChoiceIndex = 0;
            const node = bhAdventure[bhCurrentNode];
            const choicesText = Object.keys(node.choices).length > 0
                ? '\n\n> ' + Object.keys(node.choices).map((c, i) => makeClickable(c, c, i)).join(' | ')
                : '';
            terminal.innerHTML = '';
            const output = document.createElement('div');
            output.className = 'output';
            output.innerHTML = node.text + choicesText;
            terminal.appendChild(output);
            createPrompt();
            setTimeout(updateChoiceHighlight, 0);
            return null;
        } else if(bhAdventure[bhCurrentNode].choices[cmdLower]) {
            bhCurrentNode = bhAdventure[bhCurrentNode].choices[cmdLower];
            bhChoiceIndex = 0;
            const node = bhAdventure[bhCurrentNode];
            const choicesText = Object.keys(node.choices).length > 0
                ? '\n\n> ' + Object.keys(node.choices).map((c, i) => makeClickable(c, c, i)).join(' | ')
                : '';
            // Clear the terminal for narrative flow
            terminal.innerHTML = '';
            const output = document.createElement('div');
            output.className = 'output';
            output.innerHTML = node.text + choicesText;
            terminal.appendChild(output);
            createPrompt();
            setTimeout(updateChoiceHighlight, 0);
            return null; // Don't create another prompt
        } else {
            const validChoices = Object.keys(bhAdventure[bhCurrentNode].choices);
            if(validChoices.length > 0) {
                return `Invalid choice. Try: ${validChoices.join(' | ')}`;
            } else {
                return "Type 'restart' to play again or 'quit' to exit.";
            }
        }
    }

    if(cmdLower === 'ls') return Object.keys(sections).join('  ');
    else if(cmdLower === 'sl') {
        animateTrain();
        return null; // null signals not to create a new prompt
    }
    else if(cmdLower === 'help') return `This is a terminal-style interface. Type commands and press Enter.\n\nBasic commands:\n  ${makeClickable('ls', 'ls')}                List all sections\n  ${makeClickable('publications', 'publications')}      View publications\n  ${makeClickable('research', 'research')}          View research\n  ${makeClickable('teaching', 'teaching')}          View teaching\n  ${makeClickable('contact', 'contact')}           View contact info\n  ${makeClickable('other', 'other')}             View other projects\n  ${makeClickable('cat', 'cat')} &lt;section&gt;     Alternative syntax (e.g., 'cat research')\n  ${makeClickable('clear', 'clear')}             Clear screen\n  ${makeClickable('exit', 'exit')}              Close this tab\n\nQuick actions:\n  ${makeClickable('mail', 'mail')}              Email Majo\n  ${makeClickable('cv', 'cv')}                Download CV\n  ${makeClickable('links', 'links')}             Show all contact links\n\nFun:\n  ${makeClickable('bh', 'bh')}                Interactive black hole adventure!\n  ${makeClickable('snakebar', 'snakebar')}          Space-filling curve loading animation\n\nTips:\n  • Commands are case-insensitive\n  • Use Tab for auto-completion\n  • Use ↑/↓ arrows for command history\n  • Try other common Unix commands for surprises!`;
    else if(cmdLower === 'cat') {
        return "cat: missing operand\nTry 'cat &lt;section&gt;' or just type the section name.";
    } else if(cmdLower.startsWith('cat ')) {
        const name = cmdLower.split(' ')[1];
        return sections[name] || `cat: ${cmdLower.split(' ')[1]}: No such file or directory`;
    } else if(cmdLower === 'clear') {
        terminal.innerHTML = '';
        return '';
    } else if(cmdLower === 'exit' || cmdLower === 'quit') {
        window.close();
        return "Goodbye! (If the tab didn't close, your browser blocked it for security reasons)";
    } else if(cmdLower === 'whoami') {
        return "You are a visitor exploring Majo's corner of the internet.";
    } else if(cmdLower === 'sudo' || cmdLower.startsWith('sudo ')) {
        return "Nice try! You don't need root access here. 😎";
    } else if(cmdLower === 'lisa') {
        return "     *\n    / \\\n   /   \\\n  *-----*\n\nLISA: Laser Interferometer Space Antenna\nThree spacecraft in a triangular formation\nDetecting gravitational waves from space! 🛰️";
    } else if(cmdLower === 'mail' || cmdLower === 'email') {
        window.location.href = 'mailto:bustamante.rosell@vanderbilt.edu';
        return "Opening your email client...";
    } else if(cmdLower === 'cv') {
        window.open('cv.pdf', '_blank');
        return "Opening CV in new tab...";
    } else if(cmdLower === 'links') {
        return "Quick Links:\n• Email: bustamante [dot] rosell [at] vanderbilt [dot] edu\n• ORCID: <a href='https://orcid.org/0000-0003-0416-9818' target='_blank'>0000-0003-0416-9818</a>\n• GitHub: <a href='https://github.com/majoburo' target='_blank'>github.com/majoburo</a>\n• CV: <a href='cv.pdf' target='_blank'>Download PDF</a>";
    } else if(cmdLower === 'about') {
        return sections['home'];
    } else if(cmdLower.startsWith('rm ')) {
        const response = rmResponses[rmCounter % rmResponses.length];
        rmCounter++;
        return response;
    } else if(cmdLower === 'bh' || cmdLower === 'blackhole') {
        bhAdventureActive = true;
        bhCurrentNode = 'start';
        bhChoiceIndex = 0;
        const node = bhAdventure[bhCurrentNode];
        const choicesText = Object.keys(node.choices).length > 0
            ? '\n\n> ' + Object.keys(node.choices).map((c, i) => makeClickable(c, c, i)).join(' | ')
            : '';
        // Clear terminal and show adventure start
        terminal.innerHTML = '';
        const output = document.createElement('div');
        output.className = 'output';
        output.innerHTML = node.text + choicesText;
        terminal.appendChild(output);
        createPrompt();
        setTimeout(updateChoiceHighlight, 0);
        return null; // Don't create another prompt
    } else if(cmdLower === 'snakebar' || cmdLower === 'snake') {
        animateSnakeBar();
        return null; // Don't create a new prompt - animateSnakeBar handles it
    } else if(cmdLower === 'cd' || cmdLower.startsWith('cd ')) {
        const args = cmd.trim().split(/\s+/);
        if(args.length === 1) {
            return "cd: missing operand";
        } else {
            return `cd: ${args[1]}: Not a directory`;
        }
    } else if(sections[cmdLower]) {
        return sections[cmdLower];
    } else {
        return `'${cmd}' is not recognized. Type 'help'.`;
    }
}

function createPrompt(prefill='') {
    const line = document.createElement('div');
    line.className = 'command-line';
    // Don't show prompt during black hole adventure
    if(bhAdventureActive) {
        line.innerHTML = '<span class="prompt"></span>';
        // Reset choice index
        bhChoiceIndex = 0;
    } else {
        line.innerHTML = '<span class="prompt">user@website:~$ </span>';
    }

    const input = document.createElement('span');
    input.contentEditable = true;
    input.spellcheck = false;
    input.textContent = prefill;
    line.appendChild(input);
    
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = ' ';
    line.appendChild(cursor);
    
    terminal.appendChild(line);
    input.focus();
    line.scrollIntoView({behavior: "smooth", block: "end"});

    // Highlight first choice if in adventure mode
    if(bhAdventureActive) {
        setTimeout(updateChoiceHighlight, 0);
    }

    input.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') {
            e.preventDefault();
            let command = input.textContent.trim();

            // If in adventure mode and input is empty, use highlighted choice
            if(bhAdventureActive && !command) {
                const choices = Object.keys(bhAdventure[bhCurrentNode].choices);
                if(choices.length > 0) {
                    command = choices[bhChoiceIndex];
                }
            }

            if(command) commandHistory.push(command);
            historyIndex = commandHistory.length;
            input.contentEditable = false;
            line.removeChild(cursor);
            const outputText = runBuiltinCommand(command);
            if(outputText !== null) {
                if(outputText) {
                    const output = document.createElement('div');
                    output.className = 'output';
                    output.innerHTML = outputText; // use innerHTML to allow links
                    terminal.appendChild(output);
                }
                createPrompt();
            }
        } else if(e.key === 'Tab') {
            e.preventDefault();
            const currentText = input.textContent.trim();
            const parts = currentText.split(' ');

            // If we're completing an argument (e.g., 'cat pub<tab>')
            if(parts.length > 1) {
                const baseCmd = parts[0];
                const partialArg = parts[parts.length - 1];
                const sectionNames = Object.keys(sections);
                const matches = sectionNames.filter(name => name.startsWith(partialArg.toLowerCase()));

                if(matches.length === 1) {
                    parts[parts.length - 1] = matches[0];
                    input.textContent = parts.join(' ');
                    placeCaretAtEnd(input);
                } else if(matches.length > 1) {
                    const output = document.createElement('div');
                    output.className = 'output';
                    output.textContent = matches.join('  ');
                    input.contentEditable = false;
                    line.removeChild(cursor);
                    terminal.appendChild(output);
                    createPrompt(currentText);
                }
            } else {
                // Completing the command itself
                const allCommands = ['ls', 'help', 'clear', 'cat', 'exit', 'mail', 'cv', 'links', 'about', 'snakebar', 'bh', ...Object.keys(sections)];
                const matches = allCommands.filter(cmd => cmd.startsWith(currentText.toLowerCase()));

                if(matches.length === 1) {
                    input.textContent = matches[0];
                    placeCaretAtEnd(input);
                } else if(matches.length > 1) {
                    const output = document.createElement('div');
                    output.className = 'output';
                    output.textContent = matches.join('  ');
                    input.contentEditable = false;
                    line.removeChild(cursor);
                    terminal.appendChild(output);
                    createPrompt(currentText);
                }
            }
        } else if(e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();

            // If in black hole adventure, use arrows to navigate choices
            if(bhAdventureActive) {
                const choices = Object.keys(bhAdventure[bhCurrentNode].choices);
                if(choices.length > 0) {
                    if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        bhChoiceIndex = (bhChoiceIndex - 1 + choices.length) % choices.length;
                    } else if(e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        bhChoiceIndex = (bhChoiceIndex + 1) % choices.length;
                    }
                    updateChoiceHighlight();
                }
            } else {
                // Normal command history navigation
                if(e.key === 'ArrowUp') {
                    if(commandHistory.length > 0) {
                        historyIndex = Math.max(historyIndex-1, 0);
                        input.textContent = commandHistory[historyIndex];
                        placeCaretAtEnd(input);
                    }
                } else if(e.key === 'ArrowDown') {
                    if(commandHistory.length > 0) {
                        historyIndex = Math.min(historyIndex+1, commandHistory.length);
                        if(historyIndex === commandHistory.length) input.textContent = '';
                        else input.textContent = commandHistory[historyIndex];
                        placeCaretAtEnd(input);
                    }
                }
            }
        }
    });
}

function placeCaretAtEnd(el) {
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    el.focus();
}

document.addEventListener('click', () => {
    const lines = document.querySelectorAll('.command-line span[contenteditable="true"]');
    if(lines.length > 0) lines[lines.length-1].focus();
});

function bootSequence() {
    const banner = document.createElement('div');
    banner.className = 'output';
    banner.innerHTML = `
===================================================
    María José Bustamante Rosell (a.k.a. Majo)
===================================================

Try these commands to explore:
  ${makeClickable('publications', 'publications')}  ${makeClickable('research', 'research')}  ${makeClickable('teaching', 'teaching')}  ${makeClickable('contact', 'contact')}

Or type ${makeClickable('ls', 'ls')} to list all sections, ${makeClickable('help', 'help')} for more info.
`;
    terminal.appendChild(banner);
    createPrompt();
}

bootSequence();
